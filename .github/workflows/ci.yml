name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Import contracts
        run: uv run lint-imports

  docs:
    name: Docs catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check docs catalog
        run: make docs-check

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        # `--extra backtesting` pulls in vectorbt/numba/scikit-learn/scipy,
        # needed to resolve `maverick/backtesting/**` imports.
        # `--extra research` pulls in langchain-*/langgraph/exa-py, needed to
        # resolve `maverick/platform/llm.py` (lazy `langchain_anthropic`/
        # `langchain_openai` imports inside `get_llm()`), `maverick/research/
        # agents/graph.py` (`langgraph.graph`/`langgraph.types`), and
        # `maverick/research/providers/exa.py` (lazy `exa_py`/`exa_py.api`).
        # ty statically resolves imports on every code path regardless of
        # the runtime lazy-import guard, so it needs these packages
        # installed even though they never import eagerly at module load
        # time on a base install.
        run: uv sync --extra dev --extra backtesting --extra research --frozen
      # Runs over the maverick/ package, the tests/ suite, and the evals/
      # trace tooling. Legacy maverick_mcp/ was deleted at the Phase 8
      # cutover, so this is the whole codebase's type-check gate; any
      # diagnostic in any of the three trees fails the job.
      - name: ty check (maverick/, tests/, and evals/)
        run: uv run ty check maverick tests evals

  test-unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        # `--extra dev` pulls in pytest, pytest-timeout, etc. `--extra
        # backtesting` pulls in vectorbt/numba/scikit-learn/scipy: the
        # `tests/backtesting` tree imports them at collection time.
        # `--extra research` pulls in langchain-*/langgraph/exa-py: the
        # `tests/research` tree imports them at collection time.
        run: uv sync --extra dev --extra backtesting --extra research --frozen
      - name: Run unit tests
        run: |
          uv run pytest \
            -m "not integration and not slow and not external" \
            --maxfail=5 \
            --timeout=60


  core-wheel:
    name: Installed core wheel (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build and install the core wheel outside the checkout
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/core-artifacts"
          uv venv --python 3.12 "$RUNNER_TEMP/core-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/core-wheel-venv/bin/python" "$RUNNER_TEMP/core-artifacts/"*.whl
          cp tests/structure/test_package.py "$RUNNER_TEMP/core-wheel-smoke.py"
      - name: Verify installed imports, absent optional packages/tools, and offline core call
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/core-wheel-venv/bin/python" -I "$RUNNER_TEMP/core-wheel-smoke.py"

  extracted-sdist:
    name: Extracted source archive
    runs-on: ubuntu-latest
    env:
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build and extract archives outside the checkout
        run: |
          uv build --out-dir "$RUNNER_TEMP/source-artifacts"
          mkdir "$RUNNER_TEMP/extracted-source"
          tar -xzf "$RUNNER_TEMP/source-artifacts/"*.tar.gz -C "$RUNNER_TEMP/extracted-source"
      - name: Validate shipped tests, docs, build assets, and private-file exclusions
        run: |
          unset PYTHONPATH
          source_roots=("$RUNNER_TEMP/extracted-source/"*)
          cd "${source_roots[0]}"
          uv sync --extra dev --frozen --no-editable
          uv run --no-sync python -m pytest tests/evals --collect-only
          make docs-check
          export MAVERICK_SDIST="$RUNNER_TEMP/source-artifacts/$(basename "$RUNNER_TEMP/source-artifacts/"*.tar.gz)"
          export MAVERICK_WHEEL="$RUNNER_TEMP/source-artifacts/$(basename "$RUNNER_TEMP/source-artifacts/"*.whl)"
          uv run --no-sync pytest tests/structure/test_sdist.py tests/structure/test_docs_catalog.py
          uv build --offline --out-dir "$RUNNER_TEMP/rebuilt-source-artifacts"
